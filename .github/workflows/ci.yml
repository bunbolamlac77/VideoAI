name: AIVideo Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Python Full Regression + Swift Contracts
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Runner Environment
        run: |
          uname -m
          python3 --version
          swift --version

      - name: Install Test Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            "huggingface-hub" \
            "jsonschema>=4.23,<5" \
            "cryptography>=42"

      - name: Install ffmpeg (media probes and worker tests)
        run: brew install ffmpeg

      - name: Export interpreter for the worker
        run: echo "AIVIDEO_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      - name: Validate JSON Contracts and Schemas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          paths = sorted(Path("contracts").rglob("*.json"))
          assert paths, "No JSON contracts found"

          for path in paths:
              with path.open(encoding="utf-8") as f:
                  data = json.load(f)
              if "schemas" in path.parts:
                  Draft202012Validator.check_schema(data)

          print(f"PASS: {len(paths)} JSON files validated")
          PY

      - name: Compile Python Sources (syntax)
        run: |
          python3 -m compileall -q workers/src tools tests

      - name: Run All Python Regression Suites
        shell: bash
        run: |
          mkdir -p build/reports
          set -o pipefail
          python3 tools/run_python_tests.py 2>&1 | tee build/reports/python-regression.log
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          s = json.loads(Path("build/reports/python_test_summary.json").read_text())
          records = [json.loads(line) for line in Path("build/reports/python_test_records.jsonl").read_text().splitlines() if line.strip()]
          non_pass = [r for r in records if r["status"] != "PASS"]
          print("### Python regression")
          print(f"- tests_run: {s['tests_run']}")
          print(f"- failures: {s['failures']} | errors: {s['errors']} | skipped: {s['skipped']}")
          for r in non_pass:
              print(f"- {r['status']}: {r['testcase_id']}")
          print("")
          print("<details><summary>last 40 log lines</summary>")
          print("")
          print("```")
          print("".join(Path("build/reports/python-regression.log").read_text().splitlines(keepends=True)[-40:]))
          print("```")
          print("</details>")
          assert s["successful"] and s["failures"] == 0 and s["errors"] == 0, s
          assert s["tests_run"] >= 140, "Unexpected loss of test coverage"
          # Hosted CI has no local model weights, so model-dependent tests skip by design.
          assert s["skipped"] <= 6, f"Unexpectedly skipped tests: {s['skipped']}"
          PY

      - name: Test Local Bridge (separate non-model suite)
        run: |
          python3 -m unittest discover -s tools/autobridge/tests -p 'test_*.py' -v

      - name: Parse All Swift Sources (fast syntax gate)
        run: |
          swiftc -frontend -parse apps/macos/Sources/*.swift \
            packages/AIVideoCore/Sources/*/*.swift tests/*.swift

      - name: Build macOS App (must compile with zero warnings)
        shell: bash
        run: |
          set -o pipefail
          ./tools/build_macos_app.sh 2>&1 | tee build/app-build.log
          if grep -q "warning:" build/app-build.log; then
            echo "ERROR: compiler warnings are not allowed in a release build"
            grep -n "warning:" build/app-build.log
            exit 1
          fi
          test -x apps/macos/build/AIVideo.app/Contents/MacOS/AIVideo

      - name: Run Full Regression Matrix (Python + 17 Swift suites)
        shell: bash
        run: |
          ./tools/run_tests.sh

      - name: Verify No Model Binaries Tracked by Git
        run: |
          if git ls-files | grep -E '\.(safetensors|bin|gguf)$'; then
            echo "ERROR: Model binary found in Git"
            exit 1
          fi
          echo "PASS: No model binaries tracked"

      - name: Upload Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aivideo-ci-evidence
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 7
