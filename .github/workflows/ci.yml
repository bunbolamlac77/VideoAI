name: AIVideo Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: G0 and G1 Regression
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Runner Environment
        run: |
          uname -m
          python3 --version
          swift --version

      - name: Install Test Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            "huggingface-hub" \
            "jsonschema>=4.23,<5"

      - name: Validate JSON Contracts and Schemas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          paths = sorted(Path("contracts").rglob("*.json"))
          assert paths, "No JSON contracts found"

          for path in paths:
              with path.open(encoding="utf-8") as f:
                  data = json.load(f)
              if "schemas" in path.parts:
                  Draft202012Validator.check_schema(data)

          print(f"PASS: {len(paths)} JSON files validated")
          PY

      - name: Run G0 IPC Framing and Resilience Tests
        shell: bash
        run: |
          mkdir -p build/reports
          set -o pipefail
          python3 -m unittest -v \
            tests/test_framing_resilience.py \
            2>&1 | tee build/reports/g0-framing.log

      - name: Run G0 Model Setup Tests
        run: |
          python3 -m unittest -v \
            tests/test_model_setup.py

      - name: Run G1 Python Contract Tests
        run: |
          python3 -m unittest -v \
            tests/test_g1_contracts.py

      - name: Run G1 Swift Contract Tests
        run: |
          mkdir -p build/tests build/reports
          swiftc -swift-version 6 -parse-as-library \
            packages/AIVideoCore/Sources/Models/DomainModels.swift \
            packages/AIVideoCore/Sources/Models/DataContracts.swift \
            tests/test_g1_contracts.swift \
            -o build/tests/test_g1_contracts
          ./build/tests/test_g1_contracts

      - name: Verify No Model Binaries Tracked by Git
        run: |
          if git ls-files | grep -E '\.(safetensors|bin|gguf)$'; then
            echo "ERROR: Model binary found in Git"
            exit 1
          fi
          echo "PASS: No model binaries tracked"

      - name: Upload Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aivideo-ci-evidence
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 7
