[project]
name = "aivideo-workers"
version = "0.2.0"
description = "AIVideo Python Worker runtime for local media analysis and neural inference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-lm",
    "huggingface-hub",
    "jsonschema>=4.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
