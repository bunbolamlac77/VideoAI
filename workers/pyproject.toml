[project]
name = "aivideo-workers"
version = "0.2.0"
description = "AIVideo Python Worker runtime for local media analysis and neural inference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-lm",
    "huggingface-hub",
    "cryptography>=42.0.0",
    "mlx-vlm>=0.7.10",
]

[project.optional-dependencies]
test = [
    "jsonschema>=4.23,<5",
]
# Vietnamese TTS engine (G3/S17). Optional: the worker degrades to
# `blocked_tts_runtime_unavailable` when it is absent. Install with
#   uv pip install --python <runtime> "aivideo-workers[tts]"
# Weights are separate (tools/setup_local_models.py --install --tts).
tts = [
    "kokoro-vietnamese @ git+https://github.com/iamdinhthuan/Kokoro-Vietnamese",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
